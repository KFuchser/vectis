# WHY THIS EXISTS: GitHub automatically disables scheduled workflows in a repository
# after 60 days with no repository activity. That silently flatlined daily_ingest.yml
# once already. This workflow commits a tiny timestamp file monthly so the inactivity
# timer never expires. Self-contained on purpose: only the GitHub-owned checkout action
# plus plain git, no third-party marketplace actions.
name: Keepalive

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month (well inside the 60-day window)
  workflow_dispatch:     # Allows manual run

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update keepalive timestamp and push
        run: |
          date -u +%Y-%m-%d > .github/keepalive
          if [ -z "$(git status --porcelain .github/keepalive)" ]; then
            echo "No change to .github/keepalive; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive $(cat .github/keepalive) [skip ci]"
          git push
