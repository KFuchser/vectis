name: Daily Data Factory Pipeline

on:
  schedule:
    - cron: "0 11 * * *" # Runs at 6:00 AM CST (11:00 UTC) daily
  workflow_dispatch:      # Allows manual "Push to Start"

jobs:
  ingest-and-classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Unified Ingestion Factory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # ingest_velocity_50.py is the single orchestrator entry point.
          # It calls all city spokes internally — do NOT also run the individual
          # ingest_*.py scripts here, or every city will be fetched and billed twice.
          python ingest_velocity_50.py

      - name: Run AI Classification Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python classify_engine.py
